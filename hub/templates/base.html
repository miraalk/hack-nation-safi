<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}FarmFlow hub{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('index') }}">
      <img class="logo" src="{{ url_for('static', filename='img/farmflow-logo.png') }}" alt="FarmFlow">
      <span class="brand-sub">hub</span>
    </a>
    <span class="tag">offline · coop washing station</span>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>
    Synthetic data for a hackathon prototype. Numbers reuse <code>shared/</code>, so they
    match the SMS loop and tests.
  </footer>
  {% block scripts %}{% endblock %}
</body>
</html>
