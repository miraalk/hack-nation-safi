<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}FarmFlow hub{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('index') }}">
      <img class="logo" src="{{ url_for('static', filename='img/farmflow-logo.png') }}" alt="FarmFlow">
      <span class="brand-sub">hub</span>
    </a>
    <div class="topbar-right">
      <span class="tag">{{ t('hub_tag') }}</span>
      <nav class="langnav" aria-label="Language">
        {% for code, label in langs %}
        <a class="lang {{ 'active' if lang == code else '' }}"
           href="{{ request.path }}?lang={{ code }}" title="{{ label }}">{{ code | upper }}</a>
        {% endfor %}
      </nav>
    </div>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>
    {{ t('footer') | safe }}
  </footer>
  {% block scripts %}{% endblock %}
</body>
</html>
